services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maintainance
      POSTGRES_PASSWORD: maintainance
      POSTGRES_DB: maintainance
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintainance"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
